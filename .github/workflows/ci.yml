name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Tests run the TypeScript source directly, which needs Node 22.18+.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run build

      - name: Built CLI starts
        run: node dist/cli.js --version

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test

  action:
    name: Action (self-test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Serve the test page
        run: python3 -m http.server 8080 --directory test/action > /dev/null 2>&1 &

      - name: Run this repository's action
        id: wrapguard
        uses: ./
        with:
          working-directory: test/action

      - name: Expect no wrapping changes
        run: test "${{ steps.wrapguard.outputs.changed }}" = "0"
