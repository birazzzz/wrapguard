name: wrapguard
description: Fail a pull request when text wraps onto more or fewer lines, and comment what moved.
author: FynePDF
branding:
  icon: align-left
  color: blue

inputs:
  working-directory:
    description: Folder with your wrapguard config and snapshot.
    default: "."
  config:
    description: Config file, relative to working-directory. Found automatically when empty.
    default: ""
  comment:
    description: Comment the result on the pull request. The comment is only created when something fails, and updated on later runs.
    default: "true"
  fail-on-change:
    description: Fail the job when text wraps differently.
    default: "true"
  strict:
    description: Also fail on new or missing text and pages.
    default: "false"
  github-token:
    description: Token used to comment. Needs `pull-requests: write`.
    default: ${{ github.token }}

outputs:
  changed:
    description: Number of text elements whose line count changed.
    value: ${{ steps.check.outputs.changed }}
  added:
    description: Number of new text elements.
    value: ${{ steps.check.outputs.added }}
  removed:
    description: Number of text elements that are gone.
    value: ${{ steps.check.outputs.removed }}
  failed:
    description: "`true` when the check failed."
    value: ${{ steps.check.outputs.failed }}

runs:
  using: composite
  steps:
    - name: Install wrapguard
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm install --no-audit --no-fund --include=dev --loglevel=error

    - name: Install Chromium
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npx playwright install --with-deps chromium

    - name: Check text wrapping
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/dist/action.js"
      env:
        INPUT_WORKING_DIRECTORY: "."
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_FAIL_ON_CHANGE: ${{ inputs.fail-on-change }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
