<title id="title">wrapguard check catching a line that now wraps</title>
<desc id="desc">$ npx wrapguard check
Checked 1 page at 4 widths, 188 text elements.

/
  main &gt; section &gt; p  "Edit by hand or prompt, review with 15 specialist agents an…"
    768px 1 → 2  ·  390px 2 → 3 lines

Also 1 new, 0 gone, 0 with new copy at the same line count (--verbose lists them).
✗ 1 piece of text now wraps differently on 1 page.
  If that's intended, run: wrapguard update</desc>
